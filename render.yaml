services:
  - type: web
    name: unfazed-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        value: rzp_test_unfazedMockKeyId1234
      - key: RAZORPAY_KEY_SECRET
        value: unfazedMockSecretKey5678
      - key: RAZORPAY_WEBHOOK_SECRET
        value: unfazedMockWebhookSecret999
